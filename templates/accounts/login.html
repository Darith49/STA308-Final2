{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-5">
    <div class="col-md-5 col-lg-4">
        <div class="card card-custom p-4 shadow-lg border-0">
            <div class="text-center mb-4">
                <div class="brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.5rem;">
                    <i class="bi bi-mortarboard-fill"></i>
                </div>
                <h3 class="fw-bold mb-1">Welcome Back</h3>
                <p class="text-muted small">Sign in to the University Data Portal</p>
            </div>

            <form method="post" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-bold">Username</label>
                    {{ form.username }}
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Password</label>
                    {{ form.password }}
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2 mt-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </button>
            </form>

            <div class="mt-4 pt-3 text-center border-top">
                <p class="text-muted small mb-0">Don't have an account? <a href="{% url 'accounts:register' %}" class="fw-bold text-decoration-none">Create Account</a></p>
            </div>
        </div>

        <!-- Course Note -->
        <div class="text-center mt-3 text-muted small">
            <i class="bi bi-shield-lock me-1"></i> Data isolation enforced per user (O6 objective)
        </div>
    </div>
</div>
{% endblock %}
