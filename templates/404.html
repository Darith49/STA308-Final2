{% extends 'base.html' %}

{% block title %}Page Not Found (404) — Portal{% endblock %}
{% block page_title %}Resource Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 col-lg-5">
    <div class="card p-5 text-center">
      <div class="mb-3">
        <span class="badge badge-neutral font-mono fs-6 px-3 py-1">404 NOT FOUND</span>
      </div>
      <h3 class="fw-semibold mb-2 text-dark" style="letter-spacing: -0.02em;">Resource Not Found</h3>
      <p class="text-secondary font-xs mb-4">
        The requested URL or record could not be located on the server.
      </p>
      <div>
        <a href="{% url 'dashboard' %}" class="btn btn-sm btn-dark px-3 py-2">
          <i class="fa-solid fa-arrow-left me-1"></i> Return to Dashboard
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
