{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | UniData Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/portal.css' %}?v=2.0">
  
  <style>
    body {
      background-color: var(--color-canvas);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      margin: 0;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
    }
    .brand-mark {
      width: 44px;
      height: 44px;
      background-color: var(--color-ink);
      color: var(--color-canvas);
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      position: relative;
      margin-bottom: 1rem;
    }
    .brand-mark::after {
      content: '';
      position: absolute;
      top: 6px;
      right: 6px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--color-primary);
    }
    .login-card {
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-hairline);
      border-radius: 12px;
      padding: 2.25rem;
      box-shadow: 0 1px 3px rgba(38, 37, 30, 0.04), 0 8px 24px rgba(38, 37, 30, 0.04);
    }
    .demo-box {
      margin-top: 1.75rem;
      padding: 1rem 1.15rem;
      background-color: var(--color-canvas-soft);
      border-radius: 8px;
      border: 1px solid var(--color-hairline);
    }
    .demo-chip {
      font-size: 12px;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: 6px;
      background-color: #ffffff;
      border: 1px solid var(--color-hairline-strong);
      color: var(--color-ink);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .demo-chip:hover {
      background-color: var(--color-hairline-soft);
      border-color: var(--color-ink);
      color: var(--color-ink);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="text-center mb-4">
      <div class="brand-mark">
        <i class="fa-solid fa-cube"></i>
      </div>
      <h3 class="fw-bold mb-1" style="letter-spacing: -0.025em; color: var(--color-ink);">UniData Portal</h3>
      <p class="caption-uppercase mb-0" style="color: var(--color-muted);">From messy Excel files to trusted insights</p>
    </div>

    <div class="login-card">
      <div class="d-flex align-items-center justify-content-between mb-4">
        <h5 class="fw-bold mb-0" style="color: var(--color-ink); letter-spacing: -0.015em;">Sign in to account</h5>
        <span class="badge" style="background-color: var(--color-canvas-soft); color: var(--color-muted); border: 1px solid var(--color-hairline);">v2.4</span>
      </div>
      
      {% if form.errors %}
      <div class="alert alert-danger py-2 px-3 mb-3 small" role="alert">
        <i class="fa-solid fa-circle-exclamation me-1"></i> Invalid username or password.
      </div>
      {% endif %}

      <form method="post" action="{% url 'accounts:login' %}">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label small fw-semibold" for="username">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-white text-muted border-end-0" style="border-color: var(--color-hairline-strong);"><i class="fa-solid fa-user small"></i></span>
            <input type="text" name="username" id="username" class="form-control border-start-0" placeholder="e.g. admin" required autofocus>
          </div>
        </div>

        <div class="mb-4">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="form-label small fw-semibold mb-0" for="password">Password</label>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-white text-muted border-end-0" style="border-color: var(--color-hairline-strong);"><i class="fa-solid fa-lock small"></i></span>
            <input type="password" name="password" id="password" class="form-control border-start-0" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" style="letter-spacing: -0.01em;">
          <span>Sign In to Portal</span>
          <i class="fa-solid fa-arrow-right ms-2 small"></i>
        </button>
      </form>

      <!-- Quick Demo Account Fill -->
      <div class="demo-box">
        <div class="caption-uppercase mb-2 d-flex align-items-center justify-content-between">
          <span><i class="fa-solid fa-bolt text-brand me-1"></i> Quick Test Roles</span>
          <span class="font-mono text-muted" style="font-size: 10px;">Password123!</span>
        </div>
        <div class="d-flex flex-wrap gap-1">
          <button type="button" class="demo-chip" onclick="fillCreds('admin')">Admin</button>
          <button type="button" class="demo-chip" onclick="fillCreds('registrar')">Registrar</button>
          <button type="button" class="demo-chip" onclick="fillCreds('dept_head')">Dept Head (CS)</button>
          <button type="button" class="demo-chip" onclick="fillCreds('student')">Student</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function fillCreds(role) {
      const userField = document.getElementById('username');
      const passField = document.getElementById('password');
      userField.value = role;
      passField.value = 'Password123!';
    }
  </script>
</body>
</html>
