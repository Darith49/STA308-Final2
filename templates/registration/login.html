{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | University Data Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/portal.css' %}">
  
  <style>
    body {
      background: radial-gradient(circle at 10% 20%, rgb(15, 23, 42) 0%, rgb(30, 41, 59) 90.2%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
    }
    .login-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 2.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .demo-accounts {
      margin-top: 1.5rem;
      padding: 1rem;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px dashed #cbd5e1;
      font-size: 0.8rem;
    }
    .demo-btn {
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="text-center mb-4">
      <div class="d-inline-flex p-3 rounded-4 bg-primary text-white shadow-lg mb-3">
        <i class="fa-solid fa-graduation-cap fa-2x"></i>
      </div>
      <h3 class="fw-bold text-white mb-1">University Data Portal</h3>
      <p class="text-secondary small">From messy Excel files to trusted insights</p>
    </div>

    <div class="login-card">
      <h5 class="fw-bold text-dark mb-3">Sign In</h5>
      
      {% if form.errors %}
      <div class="alert alert-danger py-2 px-3 small" role="alert">
        <i class="fa-solid fa-circle-exclamation me-1"></i> Invalid username or password.
      </div>
      {% endif %}

      <form method="post" action="{% url 'accounts:login' %}">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label small fw-semibold text-muted">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-user"></i></span>
            <input type="text" name="username" id="username" class="form-control border-start-0" placeholder="Enter username" required autofocus>
          </div>
        </div>

        <div class="mb-4">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="form-label small fw-semibold text-muted mb-0">Password</label>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-lock"></i></span>
            <input type="password" name="password" id="password" class="form-control border-start-0" placeholder="Enter password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
          <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In to Portal
        </button>
      </form>

      <!-- Quick Demo Account Fill -->
      <div class="demo-accounts">
        <div class="fw-bold text-muted mb-2 text-uppercase" style="font-size: 0.7rem; letter-spacing: 0.05em;">
          <i class="fa-solid fa-bolt text-warning me-1"></i> Quick Test Credentials (Password: <code>Password123!</code>)
        </div>
        <div class="d-flex flex-wrap gap-1">
          <button type="button" class="btn btn-outline-primary btn-sm demo-btn" onclick="fillCreds('admin')">Admin</button>
          <button type="button" class="btn btn-outline-indigo btn-sm demo-btn btn-outline-secondary" onclick="fillCreds('registrar')">Registrar</button>
          <button type="button" class="btn btn-outline-info btn-sm demo-btn" onclick="fillCreds('dept_head')">Dept Head (CS)</button>
          <button type="button" class="btn btn-outline-success btn-sm demo-btn" onclick="fillCreds('student')">Student</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function fillCreds(role) {
      const userField = document.getElementById('username');
      const passField = document.getElementById('password');
      userField.value = role;
      passField.value = 'Password123!';
    }
  </script>
</body>
</html>
